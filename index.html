<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرية التلاوة - نجع المهيدات</title>
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f1df;color:#222}
.container{max-width:1000px;margin:auto;padding:20px}.header{background:linear-gradient(135deg,#8b0000,#d4af37);color:#fff;padding:35px;text-align:center;border-radius:25px;border:4px solid #ffd700}
.logo{background:#111;display:inline-block;padding:12px 25px;border-radius:15px;color:#ffd700;font-size:22px;font-weight:bold}.logo span{display:block;color:#fff;font-size:18px}
.header h1{font-size:40px;margin:20px 0 10px}.header p{font-size:22px}.box{background:#fff;margin-top:25px;padding:25px;border-radius:20px;box-shadow:0 5px 20px #0002}
.title{text-align:center;color:#8b0000;font-size:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
label{font-weight:bold}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border-radius:10px;border:2px solid #d4af37;font-size:16px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:30px;background:#8b0000;color:#fff;font-size:20px;font-weight:bold}
.footer{display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:center;margin-top:30px;background:#111;color:#ffd700;padding:20px;border-radius:20px;font-size:18px}.footer-logo{font-weight:bold;color:#ffd700}.footer-logo span{display:block;color:#fff;font-size:14px}
@media(max-width:600px){.header h1{font-size:30px}.footer{flex-direction:column}}
</style>
</head>
<body><div class="container">
<div class="header"><div class="logo">الجنيرال سيد المصري<span>أبو نور</span></div><h1>📖 قرية التلاوة</h1><p>نجع المهيدات - الموسم الثاني</p><p>مسابقة أهل القرآن</p></div>
<div class="box"><h2 class="title">📝 تسجيل المتسابق</h2><div class="grid">
<div><label>اسم المتسابق</label><input placeholder="اكتب الاسم"></div>
<div><label>السن</label><input type="number" placeholder="اكتب السن"></div>
<div><label>المستوى</label><select><option>اختر المستوى</option><option>أقل من 15 سنة</option><option>أكبر من 15 سنة</option></select></div>
<div><label>المركز</label><select><option>اختر المركز</option><option>مركز الطود</option><option>مركز الأقصر</option><option>مركز البياضية</option><option>مركز إسنا</option><option>مركز أرمنت</option><option>مركز الزينية</option><option>مركز القرنة</option></select></div>
<div><label>مقدار القرآن المحفوظ</label><input placeholder="مثال: جزء - 5 أجزاء - القرآن كامل"></div>
<div><label>اسم المحفّظ</label><input placeholder="اكتب اسم المحفّظ"></div></div><button>إنشاء بطاقة التسجيل</button></div>
<div class="box"><h2 class="title">فعاليات وصور الموسم السابق</h2><p style="text-align:center">سيتم إضافة الصور والفعاليات هنا.</p></div>
<div class="box"><h2 class="title">لجنة التحكيم</h2><p style="text-align:center">سيتم الإعلان عنها قريبًا.</p></div>
<div class="footer"><div>«أهل القرآن هم أهل الله وخاصته»</div><div class="footer-logo">الجنيرال سيد المصري<span>أبو نور</span></div></div>
</div></body></html>
